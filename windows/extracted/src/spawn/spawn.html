      <span class="brand__sub">캐릭터 띄우기</span>
    </div>
  </header>
  <main id="stage">
    <p class="set-label pad-top"><b>누르면</b> 한 명 띄우고, <b>오른쪽 버튼</b>으로 누르면 그 캐릭터를 한 명 닫습니다.
