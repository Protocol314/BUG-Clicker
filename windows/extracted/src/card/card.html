<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data: https:; style-src 'unsafe-inline' 'self'; font-src 'self' data:; script-src 'self'">
<title>BUG Clicker 소개 이미지</title>
<link rel="stylesheet" href="../ui/fonts.css">
<link rel="stylesheet" href="../settings/settings.css">
<link rel="stylesheet" href="card.css">
<script src="../ui/theme.js"></script>
</head>
<body>
<div id="app">
  <header class="appbar">
    <div class="appbar__row drag">
      <img class="brand__logo" src="../../assets/clicker-logo.png" alt="">
      <span class="appbar__brand">BUG</span>
      <span class="brand__sub">소개 이미지</span>
      <div class="cd-bar">
        <select id="pick" translate="no" class="select" aria-label="캐릭터"></select>
      </div>
    </div>
  </header>

  <div class="cd">
    <main class="cd-prev">
      <div class="cd-frame"><canvas id="view"></canvas></div>
      <p class="set-label cd-help">X 등에 .cvclk 파일과 함께 올리면, 받는 분이 내려받기 전에 사용 조건과 주의 요소를 먼저 볼 수 있습니다. 저장하면 2400 × 1350 PNG 가 됩니다.</p>
      <p class="cd-block" id="block" hidden></p>
    </main>
    <aside class="cd-side" id="side"></aside>
  </div>

  <div class="cd-foot">
    <button id="save" class="btn btn--accent">PNG 로 저장</button>
    <button id="close" class="btn btn--ghost">닫기</button>
  </div>
</div>

<div class="layer" id="layer" hidden>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet__handle"></div>
    <div class="sheet__title" id="sheetTitle"></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="../ui/i18n-dict.js"></script>
<script src="../ui/i18n-zhcn.js"></script>
<script src="../ui/i18n.js"></script>
<script src="../ui/bubble-style.js"></script>
<script src="../ui/bubble-fx.js"></script>
<script src="../ui/layers.js"></script>
<script src="../ui/pet-fx.js"></script>
<script src="../ui/wordcheck.js"></script>
<script src="../ui/rig.js"></script>
<script src="../ui/parts-view.js"></script>
<script src="../ui/card.js"></script>
<script src="../ui/kit.js"></script>
<script src="card.js"></script>
</body>
</html>
