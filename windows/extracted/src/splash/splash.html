<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline' 'self'; font-src 'self'; script-src 'self'">
<title>BUG Clicker</title>
<link rel="stylesheet" href="../ui/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  .card { box-sizing: border-box; display: flex; align-items: center; gap: 12px; height: 68px; margin: 4px; padding: 0 16px;
    border: 1px solid rgba(232, 232, 232, .12); border-radius: 16px; background: #212121; color: #e8e8e8;
    font-family: var(--ff); box-shadow: 0 8px 22px rgba(0, 0, 0, .35); animation: up .2s ease-out; }
  img { width: 34px; height: 34px; }
  b { display: block; font-size: 14px; font-weight: 700; letter-spacing: .2em; }
  b span { letter-spacing: 0; color: #9a9a9a; font-weight: 600; margin-left: 4px; }
  i { display: block; margin-top: 2px; color: #9a9a9a; font-size: 12px; font-style: normal; }
  i::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @keyframes up { from { transform: translateY(8px); opacity: 0; } }
  
  html.light .card { border-color: rgba(28, 28, 28, .12); background: #ffffff; color: #1c1c1c; box-shadow: 0 8px 22px rgba(0, 0, 0, .16); }
  html.light b span, html.light i { color: #6b6b6b; }
</style>
</head>
<body>
  <div class="card">
    <img src="../../assets/clicker-logo.png" alt="">
    <div><b>BUG<span>Clicker</span></b><i>캐릭터를 불러오는 중</i></div>
  </div>
<script src="splash.js"></script>
<script src="../ui/i18n-dict.js"></script>
<script src="../ui/i18n-zhcn.js"></script>
<script src="../ui/i18n.js"></script>
</body>
</html>
